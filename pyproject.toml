[project]
name = "linear-opt"
version = "0.1.0"
description = "LP/MILP modelling with Gurobi and a HiGHS fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdullahi Ibrahim aadinoyiibrahim" }]
keywords = ["optimization", "linear programming", "mixed-integer programming", "gurobi", "highs", "operations research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Solver backends are optional: install only what you have / need.
gurobi = ["gurobipy>=11.0"]   # pip wheel ships a size-restricted licence
highs = ["highspy>=1.7"]
viz = ["plotly>=5.20", "pandas>=2.1"]
app = ["linear-opt[viz]", "streamlit>=1.35"]
all = ["linear-opt[gurobi,highs,app]"]

[project.scripts]
linopt = "linear_opt.cli:app"

[project.urls]
Repository = "https://github.com/aadinoyiibrahim/linear_opt"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linear_opt"]

[tool.uv]
default-groups = ["dev"]

# ----- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "N",             # naming
    "RUF",           # ruff-specific
    "PT",            # pytest style
    "D",             # docstrings
    "NPY",           # numpy
]
ignore = [
    "D105", "D107",
    "E501",  # line length is owned by `ruff format`; it never splits long strings
]

# Typographic symbols used deliberately in user-facing labels.
allowed-confusables = ["×", "·", "→", "←", "≤", "≥", "–"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PT018"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
# Checked on the interpreter in .python-version (3.12); 3.11 compatibility is
# covered by the CI test matrix (recent numpy stubs need 3.12 syntax).
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["gurobipy.*", "highspy.*", "scipy.*", "plotly.*", "pandas.*", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# highspy's stubs leave the Highs() constructor unannotated.
module = ["linear_opt.solvers.highs"]
disallow_untyped_calls = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not large"]
markers = [
    "large: instance exceeds the restricted Gurobi licence; run locally with `-m large`",
    "gurobi: requires gurobipy",
    "highs: requires highspy",
]

[tool.coverage.run]
source = ["linear_opt"]
branch = true
# The Streamlit page runs inside Streamlit's script runner, which coverage cannot
# attribute to the file. It is exercised end-to-end by tests/test_app.py
# (AppTest: every problem type, all tabs); its logic lives in app/logic.py,
# which is measured normally.
omit = ["*/linear_opt/app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]
